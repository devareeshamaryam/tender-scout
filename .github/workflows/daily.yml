name: TenderScout daily

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC every day
  workflow_dispatch:       # "Run workflow" button for manual runs

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm start
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          CPV_PREFIXES: ${{ vars.CPV_PREFIXES }}
          AWARD_LOOKBACK_DAYS: ${{ vars.AWARD_LOOKBACK_DAYS }}
          AWARD_MIN_GBP: ${{ vars.AWARD_MIN_GBP }}
          TED_COUNTRIES: ${{ vars.TED_COUNTRIES }}
          APOLLO_MAX_COMPANIES_PER_RUN: ${{ vars.APOLLO_MAX_COMPANIES_PER_RUN }}
          APOLLO_CONTACTS_PER_COMPANY: ${{ vars.APOLLO_CONTACTS_PER_COMPANY }}
          APOLLO_TITLES: ${{ vars.APOLLO_TITLES }}

  # Independent of the tender job: one failing doesn't stop the other.
  hiring:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # first runs look up many new companies at ~1 request/second
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run hiring
        env:
          # Hiring tabs go to their own sheet; the tender sheet is still read for award winners.
          HIRING_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.HIRING_GOOGLE_SERVICE_ACCOUNT_JSON }}
          HIRING_SHEET_ID: ${{ secrets.HIRING_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKABLE_LOCATIONS: ${{ vars.WORKABLE_LOCATIONS }}
          WORKABLE_QUERIES: ${{ vars.WORKABLE_QUERIES }}
          WORKABLE_SEARCH_PAGES: ${{ vars.WORKABLE_SEARCH_PAGES }}
          WORKABLE_MAX_NEW_PER_RUN: ${{ vars.WORKABLE_MAX_NEW_PER_RUN }}
          LEVER_COMPANIES: ${{ vars.LEVER_COMPANIES }}
          LEVER_MAX_NEW_PER_RUN: ${{ vars.LEVER_MAX_NEW_PER_RUN }}
          AWARDS_TAB: ${{ vars.AWARDS_TAB }}
          ENGINEERING_KEYWORDS: ${{ vars.ENGINEERING_KEYWORDS }}
          STACKS: ${{ vars.STACKS }}
          SPIKE_RATIO: ${{ vars.SPIKE_RATIO }}
          SPIKE_MIN_INCREASE: ${{ vars.SPIKE_MIN_INCREASE }}
          BASELINE_DAYS: ${{ vars.BASELINE_DAYS }}
          BURST_MIN_NEW_ENG: ${{ vars.BURST_MIN_NEW_ENG }}
          STACK_SPIKE_MIN: ${{ vars.STACK_SPIKE_MIN }}
